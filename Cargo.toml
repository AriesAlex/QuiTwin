[package]
name = "quitwin"
version = "0.1.3"
edition = "2024"
description = "Update-resistant Equicord launcher for Discord on Windows"
authors = ["ArieX"]
license = "MIT"
repository = "https://github.com/AriesAlex/QuiTwin"
build = "build.rs"

[dependencies]
anyhow = "1.0"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
walkdir = "2.5"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
